# --- HTTP: solo para certbot/redirect ---
server {
    listen 80;
    server_name flowsctrl.com;

    # Para LetsEncrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: dashboard + apps protegidas ---
server {
    listen 443 ssl http2;
    server_name flowsctrl.com;

    ssl_certificate     /etc/letsencrypt/live/flowsctrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowsctrl.com/privkey.pem;

    # Snippet interno para auth_request
    include /etc/nginx/snippets/authelia.conf;

    # -------- Authelia endpoints (UI / login) ----------
    location /api/auth/ {
        proxy_pass http://authelia:9091/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # -------- Dashboard (root) ----------
    location / {
        auth_request /authelia/auth;

        # si no estás logueado -> manda al login de Authelia y vuelve acá
        error_page 401 =302 https://$host/api/auth/?rd=$scheme://$host$request_uri;


        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # -------- Apps protegidas ----------
    # Esto protege todo lo que cuelgue de /apps/
    location /apps/ {
        auth_request /authelia/auth;
        error_page 401 =302 https://$host/api/auth/?rd=$scheme://$host$request_uri;


        # Por ahora dejamos un placeholder.
        # Luego lo cambiamos a:
        #   location /apps/app1/ { proxy_pass http://app1:8000/; }
        return 200 "OK: /apps/ protegido. Falta conectar apps.\n";
        add_header Content-Type text/plain;
    }
}
