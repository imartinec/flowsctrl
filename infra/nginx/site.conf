server {
    listen 80;
    server_name flowsctrl.com;

    # Snippet interno para auth_request
    include /etc/nginx/snippets/authelia.conf;

    # -------- Authelia endpoints (UI / login) ----------
    location /api/auth/ {
        proxy_pass http://infra-authelia-1:9091/; # Usa el nombre del contenedor
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------- Dashboard (root) ----------
    location / {
        auth_request /authelia/auth;
        
        # Ajustamos la redirección para que use la URL pública
        error_page 401 =302 https://flowsctrl.com/api/auth/?rd=$scheme://$host$request_uri;

        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # -------- Apps protegidas ----------
    location /apps/ {
        auth_request /authelia/auth;
        error_page 401 =302 https://flowsctrl.com/api/auth/?rd=$scheme://$host$request_uri;

        return 200 "OK: /apps/ protegido. Falta conectar apps.\n";
        add_header Content-Type text/plain;
    }
}